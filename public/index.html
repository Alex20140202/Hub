<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Hub —— Node.js 全栈综合站点：博客、笔记、待办、书签、短链、图床、聊天室与数据仪表盘。" />
  <meta name="theme-color" content="#6366f1" />
  <title>Hub · 全栈综合站点</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Ctext x='16' y='22' font-size='18' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/points.css" />

  <script>
    // 提前应用主题，避免闪烁
    (function () {
      try {
        var t = localStorage.getItem('hub.theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <div id="boot" class="boot">
    <div class="boot-logo">H</div>
    <div class="boot-bar"><span></span></div>
  </div>

  <header class="app-header" id="app-header" hidden>
    <div class="container header-inner">
      <a class="brand" href="#/" aria-label="Hub 首页">
        <span class="brand-mark">H</span>
        <span class="brand-text">Hub</span>
      </a>

      <nav class="nav" id="main-nav" aria-label="主导航"></nav>

      <div class="header-actions">
        <button class="icon-btn" id="theme-toggle" title="切换主题" aria-label="切换主题">
          <span class="icon-sun">☀</span><span class="icon-moon">☾</span>
        </button>
        <button class="icon-btn" id="search-btn" title="搜索 (⌘K)" aria-label="搜索">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" stroke-linecap="round" />
          </svg>
        </button>
        <div id="auth-slot" class="auth-slot"></div>
        <button class="icon-btn nav-toggle" id="nav-toggle" aria-label="菜单" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="app-main"></main>

  <footer class="app-footer" hidden>
    <div class="container footer-inner">
      <div class="footer-brand">
        <strong>Hub</strong>
        <span id="footer-tagline" class="muted">由 Node.js 驱动</span>
      </div>
      <nav class="footer-links" id="footer-links"></nav>
      <div class="footer-meta">
        <span id="footer-text" class="muted"></span>
        <span id="footer-runtime" class="muted"></span>
        <a href="https://nodejs.org" target="_blank" rel="noopener">Node.js</a>
      </div>
    </div>
  </footer>

  <div id="toasts" class="toast-stack" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="command-root"></div>

  <script type="module" src="/js/main.js"></script>
  <noscript>
    <div style="padding:40px;text-align:center">本站需要启用 JavaScript 才能运行。</div>
  </noscript>
</body>
</html>
